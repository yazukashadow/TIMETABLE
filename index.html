<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #f0f0f0;
  }

  h1 {
    margin-bottom: 10px;
    letter-spacing: 2px;
    color: #7CFC00;
    text-shadow: 0 0 10px rgba(124, 252, 0, 0.6);
  }

  #scoreBoard {
    display: flex;
    gap: 30px;
    margin-bottom: 12px;
    font-size: 18px;
  }

  #scoreBoard span { color: #7CFC00; font-weight: bold; }

  canvas {
    background: #10101a;
    border: 4px solid #7CFC00;
    border-radius: 8px;
    box-shadow: 0 0 25px rgba(124, 252, 0, 0.35);
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
  }

  #overlay h2 {
    font-size: 32px;
    margin-bottom: 10px;
    color: #ff5555;
  }

  #overlay p {
    margin-bottom: 20px;
    color: #ccc;
  }

  button {
    background: #7CFC00;
    color: #10101a;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button:hover {
    background: #9dff33;
    transform: scale(1.05);
  }

  .hidden { display: none !important; }

  #instructions {
    margin-top: 14px;
    font-size: 14px;
    color: #999;
    text-align: center;
  }

  #touchControls {
    display: none;
    margin-top: 16px;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
  }

  #touchControls button {
    width: 60px;
    height: 60px;
    font-size: 22px;
    padding: 0;
  }

  @media (max-width: 600px) {
    #touchControls { display: grid; }
  }
</style>
</head>
<body>

  <h1>SNAKE</h1>
  <div id="scoreBoard">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div id="instructions">
    Use Arrow Keys / WASD to move &nbsp;|&nbsp; Space to pause
  </div>

  <div id="touchControls">
    <div></div>
    <button data-dir="up">↑</button>
    <div></div>
    <button data-dir="left">←</button>
    <div></div>
    <button data-dir="right">→</button>
    <div></div>
    <button data-dir="down">↓</button>
    <div></div>
  </div>

  <div id="overlay">
    <h2 id="overlayTitle">SNAKE</h2>
    <p id="overlayMsg">Press Start or hit any arrow key to begin</p>
    <button id="startBtn">Start Game</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMsg = document.getElementById('overlayMsg');
  const startBtn = document.getElementById('startBtn');

  let snake, direction, nextDirection, food, score, best, gameSpeed, gameLoopId, isPaused, isRunning;

  best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function resetState() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    gameSpeed = 110;
    isPaused = false;
    isRunning = true;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
    }
  }

  function update() {
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // wall collision
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
      return gameOver();
    }

    // self collision
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
      if (gameSpeed > 55) {
        gameSpeed -= 2;
        restartLoop();
      }
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#10101a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i <= tileCount; i++) {
      ctx.beginPath();
      ctx.moveTo(i * gridSize, 0);
      ctx.lineTo(i * gridSize, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * gridSize);
      ctx.lineTo(canvas.width, i * gridSize);
      ctx.stroke();
    }

    // food
    ctx.fillStyle = '#ff5555';
    ctx.beginPath();
    const fx = food.x * gridSize + gridSize / 2;
    const fy = food.y * gridSize + gridSize / 2;
    ctx.arc(fx, fy, gridSize / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // snake
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#9dff33' : '#7CFC00';
      ctx.fillRect(
        seg.x * gridSize + 1,
        seg.y * gridSize + 1,
        gridSize - 2,
        gridSize - 2
      );
    });
  }

  function gameLoop() {
    if (isPaused || !isRunning) return;
    update();
    if (isRunning) draw();
  }

  function restartLoop() {
    clearInterval(gameLoopId);
    gameLoopId = setInterval(gameLoop, gameSpeed);
  }

  function gameOver() {
    isRunning = false;
    clearInterval(gameLoopId);
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Game Over';
    overlayMsg.textContent = `Score: ${score}  |  Best: ${best}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!isRunning) return;
    isPaused = !isPaused;
    if (isPaused) {
      overlayTitle.textContent = 'Paused';
      overlayMsg.textContent = 'Press Space or Start to resume';
      startBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  function startGame() {
    overlay.classList.add('hidden');
    if (isPaused) { isPaused = false; return; }
    resetState();
    draw();
    restartLoop();
  }

  function setDirection(dx, dy) {
    // prevent reversing directly into itself
    if (direction.x === -dx && direction.y === -dy) return;
    nextDirection = { x: dx, y: dy };
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
      case ' ': togglePause(); e.preventDefault(); break;
    }
  });

  document.querySelectorAll('#touchControls button').forEach(btn => {
    btn.addEventListener('click', () => {
      const dir = btn.dataset.dir;
      if (dir === 'up') setDirection(0, -1);
      if (dir === 'down') setDirection(0, 1);
      if (dir === 'left') setDirection(-1, 0);
      if (dir === 'right') setDirection(1, 0);
    });
  });

  startBtn.addEventListener('click', startGame);

  // initial draw before game starts
  resetState();
  draw();
  isRunning = false;
})();
</script>
</body>
</html>
